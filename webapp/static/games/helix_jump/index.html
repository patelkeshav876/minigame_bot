<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Helix Jump Tower</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body {
  background: #060913;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
#gameContainer {
  position: relative;
  width: 100%;
  max-width: 400px;
  height: 100vh;
  max-height: 700px;
  overflow: hidden;
  border-radius: 18px;
  box-shadow: 0 0 50px rgba(0,0,0,0.9);
  background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090d16 85%);
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
/* HUD */
#hud {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  z-index: 10;
}
.hud-pill {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(244, 63, 94, 0.4);
  backdrop-filter: blur(8px);
  padding: 6px 16px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.hud-score {
  font-size: 1.3rem;
  font-weight: 900;
  color: #f43f5e;
  text-shadow: 0 0 10px rgba(244,63,94,0.6);
}
.hud-level {
  font-size: 0.85rem;
  font-weight: 800;
  color: #38bdf8;
}
/* Super Smash Fire Banner */
#fireBanner {
  position: absolute;
  top: 22%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.6);
  color: #fbbf24;
  font-size: 1.8rem;
  font-weight: 900;
  text-shadow: 0 0 20px #f59e0b, 0 0 40px #ef4444;
  pointer-events: none;
  opacity: 0;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 20;
}
#fireBanner.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.1);
}
/* Modals */
.game-modal {
  position: absolute;
  inset: 0;
  background: rgba(7, 11, 22, 0.92);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}
.game-modal.hidden { display: none !important; }
.modal-box {
  background: linear-gradient(180deg, #1e1b4b 0%, #0c0f1d 100%);
  border: 2px solid rgba(244, 63, 94, 0.45);
  border-radius: 24px;
  padding: 26px 20px;
  text-align: center;
  max-width: 320px;
  width: 100%;
  box-shadow: 0 20px 45px rgba(0,0,0,0.85), 0 0 35px rgba(244,63,94,0.3);
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.modal-title {
  font-size: 1.6rem;
  font-weight: 900;
  margin-bottom: 6px;
  color: #f43f5e;
  letter-spacing: 0.02em;
}
.modal-sub {
  font-size: 0.82rem;
  color: #cbd5e1;
  margin-bottom: 18px;
  line-height: 1.4;
}
.btn-primary {
  background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
  color: #fff;
  border: none;
  border-radius: 16px;
  font-size: 1.05rem;
  font-weight: 800;
  padding: 12px 24px;
  width: 100%;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
  transition: transform 0.1s ease;
}
.btn-primary:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="cvs"></canvas>

  <div id="hud">
    <div class="hud-pill">
      <span class="hud-score" id="hudScore">0</span>
    </div>
    <div class="hud-pill">
      <span class="hud-level" id="hudLevel">STAGE 1</span>
    </div>
  </div>

  <div id="fireBanner">🔥 SUPER SMASH!</div>

  <!-- Start Modal -->
  <div id="modalStart" class="game-modal">
    <div class="modal-box">
      <div style="font-size: 3.2rem; margin-bottom: 6px;">🌀</div>
      <h1 class="modal-title">3D HELIX JUMP</h1>
      <p class="modal-sub">Drag left/right to rotate the 3D spiral tower! Drop through gaps, avoid deadly red sectors, and smash down floors!</p>
      <button class="btn-primary" id="btnStartGame">▶ START JUMPING</button>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="modalGameOver" class="game-modal hidden">
    <div class="modal-box">
      <div style="font-size: 3rem; margin-bottom: 6px;">💥</div>
      <h1 class="modal-title" style="color: #ef4444;">SPLATTER!</h1>
      <p class="modal-sub">Ball clashed into a deadly red danger zone!</p>
      
      <div style="background: rgba(0,0,0,0.5); border-radius: 14px; padding: 12px; margin-bottom: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div>
          <div style="font-size: 0.68rem; color: #94a3b8; text-transform: uppercase;">Floors Smashed</div>
          <div style="font-size: 1.4rem; font-weight: 900; color: #38bdf8;" id="finalFloors">0</div>
        </div>
        <div>
          <div style="font-size: 0.68rem; color: #94a3b8; text-transform: uppercase;">High Score</div>
          <div style="font-size: 1.4rem; font-weight: 900; color: #f43f5e;" id="finalScore">0</div>
        </div>
      </div>
      
      <button class="btn-primary" id="btnRestartGame">🔄 TRY AGAIN</button>
    </div>
  </div>
</div>

<script>
// Web Audio Synth
const Sound = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
  },
  play(type) {
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      if (type === 'bounce') {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(140, t + 0.1);
        g.gain.setValueAtTime(0.22, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.11);
      } else if (type === 'pass') {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.14);
        g.gain.setValueAtTime(0.25, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.16);
      } else if (type === 'smash') {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.22);
        g.gain.setValueAtTime(0.35, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.25);
      } else if (type === 'shatter') {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.35);
        g.gain.setValueAtTime(0.4, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.36);
      }
    } catch (_) {}
  }
};

const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let W = 360, H = 600;

function resize() {
  const container = document.getElementById('gameContainer');
  W = cvs.width = container.clientWidth;
  H = cvs.height = container.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// Game State
let gameState = 'ready'; // ready, playing, gameover
let score = 0;
let floorsSmashed = 0;
let currentStage = 1;

// 3D Tower Geometry
const POLE_RADIUS = 32;
const RING_RADIUS = 120;
const RING_TILT = 0.32; // 3D Perspective Elliptical Squish
const RING_HEIGHT = 16;  // 3D Extrusion thickness
const FLOOR_SPACING = 100;

// Tower Rotation
let towerAngle = 0;
let towerVelocity = 0;
let isDragging = false;
let lastPointerX = 0;

// Ball Physics
const BALL_FIXED_Y = 220; // Fixed camera focal point
let ball = {
  vy: 0,
  r: 10,
  scaleX: 1,
  scaleY: 1,
  passedRingsCombo: 0,
  isFireball: false,
};

// Camera World Height
let cameraWorldY = 0;
let targetCameraWorldY = 0;

// Platforms
let platforms = [];
let paintSplats = [];
let shatterParticles = [];

function createPlatform(worldY, level) {
  // Generate sector slices around 360 deg
  const gapSize = Math.max(0.9, 1.3 - level * 0.03); // radians gap
  const gapAngle = Math.random() * Math.PI * 2;
  const hasDanger = level > 1;
  const dangerSize = hasDanger ? Math.min(1.2, 0.4 + level * 0.06) : 0;
  const dangerAngle = (gapAngle + Math.PI + Math.random() * 0.5) % (Math.PI * 2);

  // Platform Color Palette
  const themes = [
    { top: '#38bdf8', rim: '#0284c7' }, // Cyan
    { top: '#10b981', rim: '#047857' }, // Emerald
    { top: '#a855f7', rim: '#7e22ce' }, // Purple
    { top: '#f59e0b', rim: '#b45309' }, // Amber
  ];
  const theme = themes[level % themes.length];

  return {
    worldY,
    gapAngle,
    gapSize,
    dangerAngle,
    dangerSize,
    theme,
    isShattered: false,
    splatters: [],
  };
}

function initGame() {
  score = 0;
  floorsSmashed = 0;
  currentStage = 1;
  towerAngle = 0;
  towerVelocity = 0;
  cameraWorldY = 0;
  targetCameraWorldY = 0;
  paintSplats = [];
  shatterParticles = [];

  ball.vy = 0;
  ball.scaleX = 1;
  ball.scaleY = 1;
  ball.passedRingsCombo = 0;
  ball.isFireball = false;

  platforms = [];
  for (let i = 0; i < 10; i++) {
    platforms.push(createPlatform((i + 1) * FLOOR_SPACING, i + 1));
  }

  updateHud();
}

function updateHud() {
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudLevel').textContent = `STAGE ${currentStage}`;
}

// Touch / Mouse Rotation Controller
cvs.addEventListener('pointerdown', (e) => {
  if (gameState !== 'playing') return;
  isDragging = true;
  lastPointerX = e.clientX;
  Sound.init();
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging || gameState !== 'playing') return;
  const dx = e.clientX - lastPointerX;
  lastPointerX = e.clientX;
  towerVelocity = dx * 0.012;
  towerAngle += towerVelocity;
});

window.addEventListener('pointerup', () => { isDragging = false; });
window.addEventListener('pointercancel', () => { isDragging = false; });

function checkCollisions() {
  ball.vy += 0.38; // Gravity
  cameraWorldY += ball.vy;

  // Ball squash recovery
  ball.scaleX += (1 - ball.scaleX) * 0.15;
  ball.scaleY += (1 - ball.scaleY) * 0.15;

  platforms.forEach(p => {
    if (p.isShattered) return;

    // Platform relative Y to ball focal point
    const platformScreenY = BALL_FIXED_Y + (p.worldY - cameraWorldY);

    // Collision threshold at top rim
    if (ball.vy > 0 && Math.abs(platformScreenY - BALL_FIXED_Y) < 14) {
      // Calculate where ball hits relative to platform rotation
      let hitA = (-towerAngle) % (Math.PI * 2);
      if (hitA < 0) hitA += Math.PI * 2;

      // 1. Check if hit is in Gap
      let diffGap = Math.abs(hitA - p.gapAngle);
      if (diffGap > Math.PI) diffGap = Math.PI * 2 - diffGap;

      if (diffGap < p.gapSize / 2) {
        // Passed through gap!
        ball.passedRingsCombo++;
        score += 10 * ball.passedRingsCombo;
        floorsSmashed++;
        currentStage = Math.floor(floorsSmashed / 5) + 1;
        updateHud();

        if (ball.passedRingsCombo >= 3 && !ball.isFireball) {
          ball.isFireball = true;
          document.getElementById('fireBanner').classList.add('show');
        }

        Sound.play('pass');
        return;
      }

      // 2. Fireball Super Smash through platform
      if (ball.isFireball) {
        p.isShattered = true;
        score += 50;
        floorsSmashed++;
        updateHud();
        Sound.play('smash');
        triggerPlatformShatter(p);
        ball.passedRingsCombo = 0;
        ball.isFireball = false;
        document.getElementById('fireBanner').classList.remove('show');
        return;
      }

      // 3. Check if hit is in Danger zone
      if (p.dangerSize > 0) {
        let diffDanger = Math.abs(hitA - p.dangerAngle);
        if (diffDanger > Math.PI) diffDanger = Math.PI * 2 - diffDanger;

        if (diffDanger < p.dangerSize / 2) {
          // Dead! Splatter on danger zone
          gameOver();
          return;
        }
      }

      // 4. Safe Bounce on top face!
      cameraWorldY = p.worldY; // Snap to platform
      ball.vy = -8.2;          // Spring bounce
      ball.scaleX = 1.35;      // Squash
      ball.scaleY = 0.65;
      ball.passedRingsCombo = 0;
      ball.isFireball = false;
      document.getElementById('fireBanner').classList.remove('show');
      Sound.play('bounce');

      // Leave paint splatter decal on rotating platform
      p.splatters.push({
        angle: hitA,
        radius: 12 + Math.random() * 8,
        color: '#f43f5e',
      });
    }
  });

  // Recycle platforms that passed above camera
  if (platforms.length && BALL_FIXED_Y + (platforms[0].worldY - cameraWorldY) < -120) {
    const topP = platforms[platforms.length - 1];
    platforms.shift();
    platforms.push(createPlatform(topP.worldY + FLOOR_SPACING, currentStage + 1));
  }
}

function triggerPlatformShatter(p) {
  const py = BALL_FIXED_Y + (p.worldY - cameraWorldY);
  for (let i = 0; i < 28; i++) {
    const a = Math.random() * Math.PI * 2;
    shatterParticles.push({
      x: W / 2 + Math.cos(a) * (RING_RADIUS * 0.7),
      y: py + Math.sin(a) * (RING_RADIUS * RING_TILT),
      vx: Math.cos(a) * (4 + Math.random() * 6),
      vy: (Math.random() - 0.7) * 8,
      size: 4 + Math.random() * 6,
      color: Math.random() < 0.3 ? '#ef4444' : p.theme.top,
      life: 25,
      maxLife: 25,
    });
  }
}

function gameOver() {
  gameState = 'gameover';
  Sound.play('shatter');

  // Spawn ball death shatter
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    shatterParticles.push({
      x: W / 2,
      y: BALL_FIXED_Y,
      vx: Math.cos(a) * (4 + Math.random() * 7),
      vy: Math.sin(a) * (4 + Math.random() * 7),
      size: 5,
      color: '#f43f5e',
      life: 30,
      maxLife: 30,
    });
  }

  document.getElementById('finalFloors').textContent = floorsSmashed;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('modalGameOver').classList.remove('hidden');
}

// Draw 3D Cylindrical Ring Platform
function draw3DPlatform(p, screenY) {
  const cx = W / 2;
  const rx = RING_RADIUS;
  const ry = RING_RADIUS * RING_TILT;
  const h = RING_HEIGHT;

  ctx.save();

  // 1. Draw 3D Extruded Front Rim (Bottom thickness)
  ctx.fillStyle = p.theme.rim;
  ctx.beginPath();
  ctx.ellipse(cx, screenY + h, rx, ry, 0, 0, Math.PI); // Front half bottom
  ctx.lineTo(cx - rx, screenY);
  ctx.ellipse(cx, screenY, rx, ry, 0, Math.PI, 0, true); // Front half top
  ctx.closePath();
  ctx.fill();

  // 2. Draw Top Elliptical Platform Face
  ctx.fillStyle = p.theme.top;
  ctx.beginPath();
  ctx.ellipse(cx, screenY, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();

  // 3. Draw Cutout Gap (Eraser to create transparent opening)
  ctx.globalCompositeOperation = 'destination-out';
  const gapStart = towerAngle + p.gapAngle - p.gapSize / 2;
  const gapEnd = towerAngle + p.gapAngle + p.gapSize / 2;
  ctx.beginPath();
  ctx.moveTo(cx, screenY);
  ctx.arc(cx, screenY, rx + 10, gapStart, gapEnd);
  ctx.closePath();
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // 4. Draw Danger Lava Sectors (Red Spikes / Slices)
  if (p.dangerSize > 0) {
    const dangerStart = towerAngle + p.dangerAngle - p.dangerSize / 2;
    const dangerEnd = towerAngle + p.dangerAngle + p.dangerSize / 2;
    
    // Danger top face
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(cx, screenY);
    ctx.arc(cx, screenY, rx, dangerStart, dangerEnd);
    ctx.closePath();
    ctx.fill();

    // Danger glowing border
    ctx.strokeStyle = '#fee2e2';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // 5. Draw Paint Splatters on platform
  p.splatters.forEach(s => {
    const a = towerAngle + s.angle;
    const sx = cx + Math.cos(a) * (rx * 0.75);
    const sy = screenY + Math.sin(a) * (ry * 0.75);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.ellipse(sx, sy, s.radius, s.radius * RING_TILT, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

// Draw Central 3D Column Pole
function drawCentralPole() {
  const cx = W / 2;
  const r = POLE_RADIUS;

  const grad = ctx.createLinearGradient(cx - r, 0, cx + r, 0);
  grad.addColorStop(0, '#0f172a');
  grad.addColorStop(0.3, '#334155');
  grad.addColorStop(0.7, '#64748b');
  grad.addColorStop(1, '#0f172a');

  ctx.fillStyle = grad;
  ctx.fillRect(cx - r, 0, r * 2, H);

  // Subtle highlight beam
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.fillRect(cx - r * 0.2, 0, r * 0.4, H);
}

// Draw Bouncing Sphere Ball
function drawBall() {
  if (gameState === 'gameover') return;

  const cx = W / 2;
  const cy = BALL_FIXED_Y;
  const r = ball.r;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(ball.scaleX, ball.scaleY);

  if (ball.isFireball) {
    // Blazing Fireball Effect
    ctx.shadowColor = '#f59e0b';
    ctx.shadowBlur = 24;
    const fGrad = ctx.createRadialGradient(-3, -3, 1, 0, 0, r);
    fGrad.addColorStop(0, '#fef08a');
    fGrad.addColorStop(0.5, '#f97316');
    fGrad.addColorStop(1, '#dc2626');
    ctx.fillStyle = fGrad;
  } else {
    // Shiny 3D Neon Sphere
    ctx.shadowColor = '#f43f5e';
    ctx.shadowBlur = 14;
    const sGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, r);
    sGrad.addColorStop(0, '#ffffff');
    sGrad.addColorStop(0.35, '#f43f5e');
    sGrad.addColorStop(1, '#881337');
    ctx.fillStyle = sGrad;
  }

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawGame() {
  ctx.clearRect(0, 0, W, H);

  // Tower rotation inertia damping
  if (!isDragging) {
    towerVelocity *= 0.92;
    towerAngle += towerVelocity;
  }

  // 1. Draw 3D Central Pillar
  drawCentralPole();

  // 2. Draw 3D Helix Platforms
  platforms.forEach(p => {
    if (p.isShattered) return;
    const py = BALL_FIXED_Y + (p.worldY - cameraWorldY);
    if (py > -100 && py < H + 100) {
      draw3DPlatform(p, py);
    }
  });

  // 3. Draw Bouncing 3D Ball
  drawBall();

  // 4. Draw Particles
  shatterParticles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = pt.life / pt.maxLife;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.4;
    pt.life--;
  });
  ctx.globalAlpha = 1.0;
  shatterParticles = shatterParticles.filter(pt => pt.life > 0);
}

function loop() {
  if (gameState === 'playing') {
    checkCollisions();
  }
  drawGame();
  requestAnimationFrame(loop);
}
loop();

document.getElementById('btnStartGame').addEventListener('click', () => {
  document.getElementById('modalStart').classList.add('hidden');
  initGame();
  gameState = 'playing';
});

document.getElementById('btnRestartGame').addEventListener('click', () => {
  document.getElementById('modalGameOver').classList.add('hidden');
  initGame();
  gameState = 'playing';
});

// Pause / Resume messages from parent
window.addEventListener('message', (e) => {
  if (e.data?.type === 'PAUSE_GAME' && gameState === 'playing') {
    gameState = 'paused';
  } else if (e.data?.type === 'RESUME_GAME' && gameState === 'paused') {
    gameState = 'playing';
  }
});
</script>
</body>
</html>
