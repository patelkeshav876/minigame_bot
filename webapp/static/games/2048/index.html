<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
body{background:#0f172a;color:#f8fafc;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:12px;}
.header{width:100%;max-width:360px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.title{font-size:2rem;font-weight:900;color:#f59e0b;}
.scores{display:flex;gap:8px;}
.box{background:#1e293b;padding:6px 12px;border-radius:12px;text-align:center;min-width:70px;}
.box-lbl{font-size:0.65rem;color:#94a3b8;font-weight:700;}
.box-val{font-size:1.1rem;font-weight:900;color:#38bdf8;}
#grid{width:100%;max-width:360px;aspect-ratio:1;background:#1e293b;border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;touch-action:none;}
.tile{background:#334155;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;transition:all 0.12s ease;}
.t-2{background:#e2e8f0;color:#1e293b;}
.t-4{background:#fed7aa;color:#7c2d12;}
.t-8{background:#f97316;color:#fff;}
.t-16{background:#ea580c;color:#fff;}
.t-32{background:#dc2626;color:#fff;}
.t-64{background:#b91c1c;color:#fff;}
.t-128{background:#facc15;color:#422006;font-size:1.4rem;}
.t-256{background:#eab308;color:#422006;font-size:1.4rem;}
.t-512{background:#ca8a04;color:#fff;font-size:1.4rem;}
.t-1024{background:#10b981;color:#fff;font-size:1.1rem;}
.t-2048{background:#06b6d4;color:#fff;font-size:1.1rem;box-shadow:0 0 20px #06b6d4;}
.btn{margin-top:14px;background:linear-gradient(135deg,#fde047,#f59e0b);color:#451a03;border:none;padding:10px 24px;border-radius:999px;font-weight:800;font-size:0.9rem;cursor:pointer;}
</style>
</head>
<body>
<div class="header">
  <div class="title">2048</div>
  <div class="scores">
    <div class="box"><div class="box-lbl">SCORE</div><div id="score" class="box-val">0</div></div>
    <div class="box"><div class="box-lbl">BEST</div><div id="best" class="box-val">0</div></div>
  </div>
</div>
<div id="grid"></div>
<button class="btn" onclick="init()">🔄 New Game</button>
<script>
let board = Array(16).fill(0), score = 0, best = parseInt(localStorage.getItem('2048_best')||0);
document.getElementById('best').textContent = best;
function init() {
  board = Array(16).fill(0); score = 0; updateScore(0);
  spawn(); spawn(); render();
}
function spawn() {
  let empty = board.map((v,i)=>v===0?i:null).filter(v=>v!==null);
  if (!empty.length) return;
  board[empty[Math.floor(Math.random()*empty.length)]] = Math.random() < 0.9 ? 2 : 4;
}
function updateScore(add) {
  score += add;
  document.getElementById('score').textContent = score;
  if (score > best) { best = score; localStorage.setItem('2048_best', best); document.getElementById('best').textContent = best; }
}
function render() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  board.forEach(v => {
    let d = document.createElement('div');
    d.className = 'tile ' + (v ? 't-' + v : '');
    d.textContent = v ? v : '';
    g.appendChild(d);
  });
}
function slide(row) {
  let arr = row.filter(v => v);
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i+1]) { arr[i] *= 2; updateScore(arr[i]); arr.splice(i+1, 1); }
  }
  while (arr.length < 4) arr.push(0);
  return arr;
}
function move(dir) {
  let prev = [...board];
  for (let i = 0; i < 4; i++) {
    let row = [];
    for (let j = 0; j < 4; j++) {
      let idx = dir==='left'?i*4+j : dir==='right'?i*4+(3-j) : dir==='up'?j*4+i : (3-j)*4+i;
      row.push(board[idx]);
    }
    let res = slide(row);
    for (let j = 0; j < 4; j++) {
      let idx = dir==='left'?i*4+j : dir==='right'?i*4+(3-j) : dir==='up'?j*4+i : (3-j)*4+i;
      board[idx] = res[j];
    }
  }
  if (board.some((v,i)=>v!==prev[i])) { spawn(); render(); }
}
window.addEventListener('keydown', e => {
  if (['ArrowLeft','a','A'].includes(e.key)) move('left');
  if (['ArrowRight','d','D'].includes(e.key)) move('right');
  if (['ArrowUp','w','W'].includes(e.key)) move('up');
  if (['ArrowDown','s','S'].includes(e.key)) move('down');
});
let sx, sy;
const g = document.getElementById('grid');
g.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
g.addEventListener('touchend', e => {
  let dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) move(dx > 0 ? 'right' : 'left');
  else if (Math.abs(dy) > 30) move(dy > 0 ? 'down' : 'up');
}, {passive:true});
init();
</script>
</body>
</html>
