<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Minesweeper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#090d16;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
.top{width:100%;max-width:320px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.box{background:#1e293b;padding:6px 12px;border-radius:10px;font-weight:900;color:#ef4444;font-family:monospace;font-size:1.2rem;}
.face-btn{background:#1e293b;border:2px solid #334155;border-radius:50%;width:42px;height:42px;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#grid{display:grid;grid-template-columns:repeat(9,32px);grid-template-rows:repeat(9,32px);gap:3px;background:#1e293b;padding:8px;border-radius:14px;border:3px solid #334155;}
.cell{background:#334155;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;cursor:pointer;}
.cell.open{background:#0f172a;}
.cell.c-1{color:#38bdf8;}
.cell.c-2{color:#10b981;}
.cell.c-3{color:#ef4444;}
.cell.c-4{color:#8b5cf6;}
.mode-btn{margin-top:12px;background:#1e293b;border:2px solid #38bdf8;color:#38bdf8;padding:8px 16px;border-radius:999px;font-weight:800;font-size:0.85rem;cursor:pointer;}
.mode-btn.flag{background:#ef4444;border-color:#ef4444;color:#fff;}
</style>
</head>
<body>
<div class="top">
  <div class="box" id="mines">10</div>
  <button class="face-btn" id="face" onclick="init()">🙂</button>
  <div class="box" id="timer">000</div>
</div>
<div id="grid"></div>
<button class="mode-btn" id="modeBtn" onclick="toggleMode()">⛏️ DIG MODE</button>
<script>
const ROWS=9, COLS=9, MINES=10;
let grid=[], flags=new Set(), revealed=new Set(), flagMode=false, over=false, time=0, timerId=null;
function init() {
  grid = Array(ROWS).fill().map(()=>Array(COLS).fill(0));
  flags.clear(); revealed.clear(); over=false; time=0; clearInterval(timerId);
  document.getElementById('face').textContent = '🙂';
  document.getElementById('mines').textContent = '010';
  document.getElementById('timer').textContent = '000';
  let placed=0;
  while(placed < MINES) {
    let r=Math.floor(Math.random()*ROWS), c=Math.floor(Math.random()*COLS);
    if (grid[r][c]!==-1) { grid[r][c]=-1; placed++; }
  }
  for(let r=0; r<ROWS; r++) {
    for(let c=0; c<COLS; c++) {
      if (grid[r][c]===-1) continue;
      let count=0;
      for(let dr of [-1,0,1]) for(let dc of [-1,0,1]) {
        let nr=r+dr, nc=c+dc;
        if (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc]===-1) count++;
      }
      grid[r][c] = count;
    }
  }
  timerId = setInterval(()=>{ time++; document.getElementById('timer').textContent = String(time).padStart(3,'0'); }, 1000);
  render();
}
function toggleMode() {
  flagMode = !flagMode;
  let b = document.getElementById('modeBtn');
  b.className = 'mode-btn ' + (flagMode ? 'flag' : '');
  b.textContent = flagMode ? '🚩 FLAG MODE' : '⛏️ DIG MODE';
}
function tap(r, c) {
  if (over) return;
  let key = r+','+c;
  if (flagMode) {
    if (revealed.has(key)) return;
    if (flags.has(key)) flags.delete(key); else flags.add(key);
    document.getElementById('mines').textContent = String(MINES - flags.size).padStart(3,'0');
    render(); return;
  }
  if (flags.has(key)) return;
  if (grid[r][c] === -1) {
    over = true; clearInterval(timerId);
    document.getElementById('face').textContent = '😵';
    alert('Boom! Game Over!'); render(); return;
  }
  reveal(r, c);
  if (revealed.size === ROWS*COLS - MINES) {
    over = true; clearInterval(timerId);
    document.getElementById('face').textContent = '😎';
    alert('Congratulations! You cleared the minefield!');
  }
  render();
}
function reveal(r, c) {
  let key = r+','+c;
  if (r<0||r>=ROWS||c<0||c>=COLS||revealed.has(key)||flags.has(key)) return;
  revealed.add(key);
  if (grid[r][c] === 0) {
    for(let dr of [-1,0,1]) for(let dc of [-1,0,1]) reveal(r+dr, c+dc);
  }
}
function render() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  for(let r=0; r<ROWS; r++) {
    for(let c=0; c<COLS; c++) {
      let d = document.createElement('div');
      let key = r+','+c;
      d.className = 'cell';
      if (flags.has(key)) d.textContent = '🚩';
      else if (revealed.has(key)) {
        d.classList.add('open');
        let v = grid[r][c];
        if (v > 0) { d.textContent = v; d.classList.add('c-'+v); }
      } else if (over && grid[r][c] === -1) {
        d.textContent = '💣'; d.classList.add('open');
      }
      d.onclick = () => tap(r, c);
      g.appendChild(d);
    }
  }
}
init();
</script>
</body>
</html>
