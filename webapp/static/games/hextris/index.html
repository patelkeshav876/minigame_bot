<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hextris</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#090d16;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
#cvs{background:#111827;border:3px solid #06b6d4;border-radius:18px;box-shadow:0 0 25px rgba(6,182,212,0.3);width:100%;max-width:340px;aspect-ratio:1;cursor:pointer;}
.ctrls{display:flex;gap:20px;margin-top:12px;}
.btn{background:#1e293b;border:2px solid #06b6d4;color:#06b6d4;font-size:1.6rem;padding:10px 24px;border-radius:14px;cursor:pointer;}
</style>
</head>
<body>
<div style="font-weight:900;color:#06b6d4;margin-bottom:8px;">🔷 HEXTRIS ROTATION</div>
<canvas id="cvs" width="340" height="340"></canvas>
<div class="ctrls">
  <button class="btn" onclick="angle-=Math.PI/3">↺</button>
  <button class="btn" onclick="angle+=Math.PI/3">↻</button>
</div>
<script>
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
let angle = 0, score = 0, bars = [];
const COLORS = ['#ef4444','#38bdf8','#facc15','#10b981'];
function spawn() {
  bars.push({dist: 170, side: Math.floor(Math.random()*6), color: COLORS[Math.floor(Math.random()*COLORS.length)]});
}
setInterval(spawn, 1200);
function update() {
  bars.forEach(b => {
    b.dist -= 1.8;
    if (b.dist <= 45) { score += 10; b.dead = true; }
  });
  bars = bars.filter(b => !b.dead);
}
function draw() {
  ctx.clearRect(0,0,340,340);
  ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('SCORE: ' + score, 15, 25);
  ctx.save(); ctx.translate(170, 170); ctx.rotate(angle);
  // Center Hexagon
  ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 4;
  ctx.beginPath();
  for(let i=0; i<6; i++) {
    let a = i * Math.PI / 3;
    let x = 40 * Math.cos(a), y = 40 * Math.sin(a);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Bars
  bars.forEach(b => {
    ctx.save(); ctx.rotate(b.side * Math.PI / 3);
    ctx.fillStyle = b.color;
    ctx.fillRect(-22, b.dist, 44, 10);
    ctx.restore();
  });
  ctx.restore();
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
