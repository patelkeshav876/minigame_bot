<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Ghost</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#0a0e17;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
#cvs{background:linear-gradient(180deg,#1e1b4b 0%,#0f172a 100%);border-radius:18px;border:3px solid #6366f1;box-shadow:0 0 25px rgba(99,102,241,0.3);width:100%;max-width:360px;aspect-ratio:3/4;cursor:pointer;}
</style>
</head>
<body>
<canvas id="cvs" width="360" height="480"></canvas>
<script>
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
let bird = {x:60, y:240, vy:0, r:16}, pipes = [], score = 0, best = 0, state = 'start';
function jump() {
  if (state==='start') { state = 'play'; pipes = []; score = 0; bird.y = 240; bird.vy = -6; }
  else if (state==='play') bird.vy = -6.5;
  else if (state==='over') { state = 'start'; }
}
window.addEventListener('keydown', e => { if (e.code==='Space') jump(); });
cvs.addEventListener('pointerdown', jump);
function update() {
  if (state !== 'play') return;
  bird.vy += 0.32; bird.y += bird.vy;
  if (pipes.length === 0 || pipes[pipes.length-1].x < 210) {
    let top = 40 + Math.random()*220;
    pipes.push({x: 360, top, gap: 125, passed:false});
  }
  pipes.forEach(p => {
    p.x -= 2.2;
    if (!p.passed && p.x + 40 < bird.x) { p.passed = true; score++; if(score>best)best=score; }
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 40) {
      if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + p.gap) state = 'over';
    }
  });
  pipes = pipes.filter(p => p.x > -50);
  if (bird.y > 470 || bird.y < 10) state = 'over';
}
function draw() {
  ctx.clearRect(0,0,360,480);
  // Pipes
  pipes.forEach(p => {
    ctx.fillStyle = '#6366f1';
    ctx.shadowColor = '#6366f1'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.roundRect(p.x, 0, 42, p.top, [0,0,10,10]); ctx.fill();
    ctx.beginPath(); ctx.roundRect(p.x, p.top + p.gap, 42, 480 - (p.top + p.gap), [10,10,0,0]); ctx.fill();
  });
  // Ghost
  ctx.shadowColor = '#a5b4fc'; ctx.shadowBlur = 15;
  ctx.font = '32px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('👻', bird.x, bird.y + 10);
  // Score
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 36px sans-serif';
  ctx.fillText(score, 180, 60);
  if (state==='start') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,360,480);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif'; ctx.fillText('TAP TO FLY 👻', 180, 240);
  } else if (state==='over') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,360,480);
    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 28px sans-serif'; ctx.fillText('GAME OVER', 180, 210);
    ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif'; ctx.fillText('Score: '+score+'  Best: '+best, 180, 250);
    ctx.font = '15px sans-serif'; ctx.fillText('Tap to Restart', 180, 290);
  }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
