<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#070b14;color:#f8fafc;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:10px;}
.top{width:100%;max-width:360px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.score{font-weight:900;color:#10b981;font-size:1.2rem;}
#canvas{background:#0f172a;border:3px solid #10b981;border-radius:16px;box-shadow:0 0 20px rgba(16,185,129,0.3);width:100%;max-width:360px;aspect-ratio:1;}
.dpad{margin-top:12px;display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,46px);gap:6px;}
.d-btn{background:#1e293b;border:1px solid #334155;color:#fff;border-radius:12px;font-size:1.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.d-btn:active{background:#10b981;}
</style>
</head>
<body>
<div class="top">
  <div style="font-weight:900;color:#38bdf8;">🐍 NEON SNAKE</div>
  <div class="score">SCORE: <span id="sc">0</span></div>
</div>
<canvas id="canvas" width="400" height="400"></canvas>
<div class="dpad">
  <div></div><button class="d-btn" onclick="setDir(0,-1)">⬆️</button><div></div>
  <button class="d-btn" onclick="setDir(-1,0)">⬅️</button><button class="d-btn" onclick="reset()">🔄</button><button class="d-btn" onclick="setDir(1,0)">➡️</button>
  <div></div><button class="d-btn" onclick="setDir(0,1)">⬇️</button><div></div>
</div>
<script>
const cvs = document.getElementById('canvas'), ctx = cvs.getContext('2d');
const GRID = 20, COUNT = 20;
let snake = [{x:10,y:10}], food = {x:15,y:15}, dir = {x:1,y:0}, nextDir = {x:1,y:0}, score = 0, over = false;
function reset() { snake = [{x:10,y:10}]; dir = {x:1,y:0}; nextDir = {x:1,y:0}; score = 0; over = false; spawnFood(); document.getElementById('sc').textContent = 0; }
function spawnFood() { food = {x: Math.floor(Math.random()*COUNT), y: Math.floor(Math.random()*COUNT)}; }
function setDir(x,y) { if (x !== -dir.x || y !== -dir.y) nextDir = {x,y}; }
window.addEventListener('keydown', e => {
  if (e.key==='ArrowUp'||e.key==='w') setDir(0,-1);
  if (e.key==='ArrowDown'||e.key==='s') setDir(0,1);
  if (e.key==='ArrowLeft'||e.key==='a') setDir(-1,0);
  if (e.key==='ArrowRight'||e.key==='d') setDir(1,0);
});
let sx, sy;
cvs.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
cvs.addEventListener('touchend', e => {
  let dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
}, {passive:true});
function update() {
  if (over) return;
  dir = nextDir;
  let head = {x: (snake[0].x + dir.x + COUNT) % COUNT, y: (snake[0].y + dir.y + COUNT) % COUNT};
  if (snake.some(s => s.x === head.x && s.y === head.y)) { over = true; return; }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) { score += 10; document.getElementById('sc').textContent = score; spawnFood(); }
  else snake.pop();
}
function draw() {
  ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,400,400);
  ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(food.x*GRID+GRID/2, food.y*GRID+GRID/2, GRID/2.2, 0, Math.PI*2); ctx.fill();
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#38bdf8' : '#10b981';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.roundRect(s.x*GRID+1, s.y*GRID+1, GRID-2, GRID-2, 6); ctx.fill();
  });
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,400,400);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', 200, 190);
    ctx.font = '16px sans-serif'; ctx.fillText('Tap 🔄 to Play Again', 200, 230);
  }
}
setInterval(()=>{ update(); draw(); }, 120);
reset();
</script>
</body>
</html>
