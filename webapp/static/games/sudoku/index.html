<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sudoku</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#090d16;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
.title{font-size:1.6rem;font-weight:900;color:#facc15;margin-bottom:8px;}
.grid{display:grid;grid-template-columns:repeat(9,34px);grid-template-rows:repeat(9,34px);gap:1px;background:#475569;border:3px solid #facc15;border-radius:14px;overflow:hidden;}
.cell{background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;cursor:pointer;}
.cell.fixed{color:#94a3b8;font-weight:900;}
.cell.sel{background:#38bdf8!important;color:#000;}
.cell:nth-child(3n){border-right:2px solid #475569;}
.pad{display:flex;gap:6px;margin-top:14px;}
.num-btn{width:36px;height:42px;background:#1e293b;border:1px solid #38bdf8;color:#38bdf8;border-radius:8px;font-size:1.2rem;font-weight:800;cursor:pointer;}
</style>
</head>
<body>
<div class="title">🧩 SUDOKU MASTER</div>
<div class="grid" id="grid"></div>
<div class="pad" id="pad"></div>
<script>
const puzzle = [
  5,3,0,0,7,0,0,0,0, 6,0,0,1,9,5,0,0,0, 0,9,8,0,0,0,0,6,0,
  8,0,0,0,6,0,0,0,3, 4,0,0,8,0,3,0,0,1, 7,0,0,0,2,0,0,0,6,
  0,6,0,0,0,0,2,8,0, 0,0,0,4,1,9,0,0,5, 0,0,0,0,8,0,0,7,9
];
let current = [...puzzle], selected = null;
function render() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  current.forEach((val, i) => {
    let d = document.createElement('div');
    d.className = 'cell ' + (puzzle[i] ? 'fixed' : '') + (selected===i ? ' sel' : '');
    d.textContent = val ? val : '';
    d.onclick = () => { selected = i; render(); };
    g.appendChild(d);
  });
}
const p = document.getElementById('pad');
for(let n=1; n<=9; n++) {
  let b = document.createElement('button'); b.className = 'num-btn'; b.textContent = n;
  b.onclick = () => { if (selected!==null && !puzzle[selected]) { current[selected] = n; render(); } };
  p.appendChild(b);
}
let clearBtn = document.createElement('button'); clearBtn.className = 'num-btn'; clearBtn.textContent = '❌';
clearBtn.onclick = () => { if (selected!==null && !puzzle[selected]) { current[selected] = 0; render(); } };
p.appendChild(clearBtn);
render();
</script>
</body>
</html>
