<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Speed Typer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#090d16;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
.title{font-size:1.6rem;font-weight:900;color:#38bdf8;margin-bottom:12px;}
.word{font-size:2.2rem;font-weight:900;color:#facc15;margin-bottom:14px;letter-spacing:0.06em;}
input{background:#1e293b;border:2px solid #38bdf8;border-radius:14px;padding:12px 18px;color:#fff;font-size:1.2rem;font-weight:700;text-align:center;outline:none;width:100%;max-width:280px;}
.stats{margin-top:16px;display:flex;gap:20px;font-size:1rem;font-weight:800;color:#94a3b8;}
</style>
</head>
<body>
<div class="title">⌨️ CYBER SPEED TYPER</div>
<div class="word" id="word">GHOST</div>
<input type="text" id="inp" placeholder="Type here..." autofocus autocomplete="off">
<div class="stats"><div>WPM: <span id="wpm" style="color:#10b981;">0</span></div><div>SCORE: <span id="sc" style="color:#38bdf8;">0</span></div></div>
<script>
const words = ['ghost','cyber','arcade','shadow','arena','blaster','laser','circuit','matrix','hacker','strike','phantom','knight','cosmic','rocket'];
let curIdx = 0, score = 0, startTime = Date.now();
function nextWord() {
  document.getElementById('word').textContent = words[Math.floor(Math.random()*words.length)].toUpperCase();
}
document.getElementById('inp').addEventListener('input', e => {
  let target = document.getElementById('word').textContent;
  if (e.target.value.toUpperCase().trim() === target) {
    score += 10; document.getElementById('sc').textContent = score;
    let mins = (Date.now() - startTime) / 60000;
    document.getElementById('wpm').textContent = Math.round((score/10) / Math.max(0.1, mins));
    e.target.value = ''; nextWord();
  }
});
nextWord();
</script>
</body>
</html>
