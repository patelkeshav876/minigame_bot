<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dino Run</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#0f172a;color:#f8fafc;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
#cvs{background:#1e293b;border:3px solid #10b981;border-radius:18px;box-shadow:0 0 25px rgba(16,185,129,0.25);width:100%;max-width:360px;aspect-ratio:3/2;cursor:pointer;}
</style>
</head>
<body>
<div style="font-weight:900;margin-bottom:8px;color:#10b981;">🦖 T-REX DESERT RUN</div>
<canvas id="cvs" width="360" height="240"></canvas>
<div style="color:#94a3b8;font-size:0.8rem;margin-top:8px;">Tap / Space to Jump</div>
<script>
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
let dino = {x: 40, y: 160, vy: 0, w: 28, h: 32, grounded: true};
let obstacles = [], score = 0, best = 0, over = false;
function jump() {
  if (over) { reset(); return; }
  if (dino.grounded) { dino.vy = -10.5; dino.grounded = false; }
}
function reset() { obstacles = []; score = 0; over = false; dino.y = 160; dino.vy = 0; dino.grounded = true; }
window.addEventListener('keydown', e => { if (e.code==='Space'||e.key==='ArrowUp') jump(); });
cvs.addEventListener('pointerdown', jump);
function update() {
  if (over) return;
  score++; if (score > best) best = score;
  dino.vy += 0.58; dino.y += dino.vy;
  if (dino.y >= 160) { dino.y = 160; dino.vy = 0; dino.grounded = true; }
  if (obstacles.length === 0 || obstacles[obstacles.length-1].x < 220) {
    if (Math.random() < 0.035) obstacles.push({x: 360, w: 18, h: 30 + Math.random()*15});
  }
  obstacles.forEach(o => {
    o.x -= 4.2;
    if (dino.x + dino.w > o.x && dino.x < o.x + o.w && dino.y + dino.h > 192 - o.h) over = true;
  });
  obstacles = obstacles.filter(o => o.x > -30);
}
function draw() {
  ctx.clearRect(0,0,360,240);
  // Ground
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 192); ctx.lineTo(360, 192); ctx.stroke();
  // Dino
  ctx.font = '32px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🦖', dino.x + dino.w/2, dino.y + dino.h);
  // Obstacles
  ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 8;
  obstacles.forEach(o => {
    ctx.beginPath(); ctx.roundRect(o.x, 192 - o.h, o.w, o.h, 4); ctx.fill();
  });
  // Scores
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('HI ' + best + '  ' + Math.floor(score/5), 340, 30);
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,360,240);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', 180, 110);
    ctx.font = '14px sans-serif'; ctx.fillText('Tap to Restart', 180, 140);
  }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
