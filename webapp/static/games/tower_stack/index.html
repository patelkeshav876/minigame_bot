<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Skyscraper Tower Stack</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body {
  background: #090d16;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
#gameContainer {
  position: relative;
  width: 100%;
  max-width: 400px;
  height: 100vh;
  max-height: 700px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.85);
  border-radius: 18px;
  background: #060913;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
}
/* HUD */
#hud {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  z-index: 10;
}
.hud-card {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(56, 189, 248, 0.4);
  backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
}
.hud-label {
  font-size: 0.65rem;
  color: #94a3b8;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.hud-val {
  font-size: 1.15rem;
  font-weight: 900;
  color: #38bdf8;
}
.hud-lives {
  display: flex;
  gap: 4px;
  font-size: 1rem;
}
/* Combo & Perfect Banner */
#comboBanner {
  position: absolute;
  top: 25%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.6);
  color: #fde047;
  font-size: 2rem;
  font-weight: 900;
  text-shadow: 0 0 15px rgba(253, 224, 71, 0.8), 0 2px 4px #000;
  pointer-events: none;
  opacity: 0;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 20;
}
#comboBanner.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.1);
}
/* Modal Overlays */
.game-modal {
  position: absolute;
  inset: 0;
  background: rgba(7, 11, 22, 0.9);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}
.game-modal.hidden { display: none !important; }
.modal-box {
  background: linear-gradient(180deg, #18223c 0%, #0c1222 100%);
  border: 2px solid rgba(56, 189, 248, 0.4);
  border-radius: 24px;
  padding: 26px 20px;
  text-align: center;
  max-width: 320px;
  width: 100%;
  box-shadow: 0 20px 45px rgba(0,0,0,0.8), 0 0 30px rgba(56,189,248,0.25);
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.modal-title {
  font-size: 1.6rem;
  font-weight: 900;
  margin-bottom: 6px;
  color: #38bdf8;
  letter-spacing: 0.02em;
}
.modal-sub {
  font-size: 0.82rem;
  color: #cbd5e1;
  margin-bottom: 18px;
  line-height: 1.4;
}
.btn-primary {
  background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
  color: #fff;
  border: none;
  border-radius: 16px;
  font-size: 1.05rem;
  font-weight: 800;
  padding: 12px 24px;
  width: 100%;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
  transition: transform 0.1s ease;
}
.btn-primary:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="cvs"></canvas>

  <div id="hud">
    <div class="hud-card">
      <span class="hud-label">Height</span>
      <span class="hud-val" id="hudFloor">1F • 3m</span>
    </div>
    <div class="hud-card">
      <span class="hud-label">Score</span>
      <span class="hud-val" id="hudScore">0</span>
    </div>
    <div class="hud-card" style="align-items: flex-end;">
      <span class="hud-label">Lives</span>
      <div class="hud-lives" id="hudLives">❤️❤️❤️</div>
    </div>
  </div>

  <div id="comboBanner">PERFECT!</div>

  <!-- Start Modal -->
  <div id="modalStart" class="game-modal">
    <div class="modal-box">
      <div style="font-size: 3rem; margin-bottom: 6px;">🏢</div>
      <h1 class="modal-title">SKYSCRAPER BUILDER</h1>
      <p class="modal-sub">Swing from the crane & tap to drop floors! Align perfectly to build into outer space!</p>
      <button class="btn-primary" id="btnStartGame">▶ START BUILDING</button>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="modalGameOver" class="game-modal hidden">
    <div class="modal-box">
      <div style="font-size: 3rem; margin-bottom: 6px;">🏗️</div>
      <h1 class="modal-title" style="color: #ef4444;">TOWER TOPPED OUT</h1>
      <p class="modal-sub" id="goSubtitle">Your skyscraper has reached its limit!</p>
      
      <div style="background: rgba(0,0,0,0.4); border-radius: 14px; padding: 12px; margin-bottom: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div>
          <div style="font-size: 0.68rem; color: #94a3b8; text-transform: uppercase;">Floors Built</div>
          <div style="font-size: 1.4rem; font-weight: 900; color: #38bdf8;" id="finalFloors">0</div>
        </div>
        <div>
          <div style="font-size: 0.68rem; color: #94a3b8; text-transform: uppercase;">Total Score</div>
          <div style="font-size: 1.4rem; font-weight: 900; color: #f59e0b;" id="finalScore">0</div>
        </div>
      </div>
      
      <button class="btn-primary" id="btnRestartGame">🔄 BUILD AGAIN</button>
    </div>
  </div>
</div>

<script>
// Web Audio Synth
const Sound = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
  },
  play(type) {
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      if (type === 'drop') {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, t);
        osc.frequency.exponentialRampToValueAtTime(140, t + 0.12);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.13);
      } else if (type === 'land') {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.16);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.19);
      } else if (type === 'perfect') {
        [523.25, 659.25, 1046.5].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t + i * 0.08);
          g.gain.setValueAtTime(0.2, t + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.28);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.3);
        });
      } else if (type === 'miss') {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(70, t + 0.3);
        g.gain.setValueAtTime(0.25, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.33);
      }
    } catch (_) {}
  }
};

const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let W = 360, H = 600;

function resize() {
  const container = document.getElementById('gameContainer');
  W = cvs.width = container.clientWidth;
  H = cvs.height = container.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// Floor architectural styles
const FLOOR_THEMES = [
  { body: '#d97706', accent: '#b45309', window: '#fef08a', frame: '#78350f' }, // Amber Brick
  { body: '#0284c7', accent: '#0369a1', window: '#bae6fd', frame: '#075985' }, // Blue Glass
  { body: '#059669', accent: '#047857', window: '#a7f3d0', frame: '#064e3b' }, // Jade Plaza
  { body: '#7c3aed', accent: '#6d28d9', window: '#ddd6fe', frame: '#4c1d95' }, // Violet Highrise
  { body: '#e11d48', accent: '#be123c', window: '#fecdd3', frame: '#881337' }, // Ruby Tower
];

// Game State
let gameState = 'ready'; // ready, playing, gameover
let score = 0;
let lives = 3;
let cameraY = 0;
let targetCameraY = 0;
let combo = 0;

// Tower Stack Array
let tower = [];
const FLOOR_HEIGHT = 44;
const DEFAULT_WIDTH = 130;

// Crane / Swing state
let craneX = W / 2;
let swingAngle = 0;
let swingSpeed = 0.038;
let cableLength = 110;

// Active Floor
let currentFloor = null;
let fallingFloor = null;
let debrisList = [];
let particles = [];

// Stars in space background
const stars = [];
for (let i = 0; i < 70; i++) {
  stars.push({ x: Math.random() * 400, y: Math.random() * 2000 - 1500, r: Math.random() * 1.8 + 0.5, a: Math.random() });
}

function initGame() {
  score = 0;
  lives = 3;
  combo = 0;
  cameraY = 0;
  targetCameraY = 0;
  debrisList = [];
  particles = [];
  fallingFloor = null;

  // Ground base
  const baseY = H - 90;
  tower = [
    {
      x: W / 2 - DEFAULT_WIDTH / 2,
      y: baseY,
      w: DEFAULT_WIDTH,
      h: FLOOR_HEIGHT + 20,
      themeIdx: 0,
      isBase: true,
    }
  ];

  spawnFloor();
  updateHud();
}

function spawnFloor() {
  const floorNum = tower.length;
  const prevFloor = tower[tower.length - 1];
  const themeIdx = (floorNum - 1) % FLOOR_THEMES.length;
  
  currentFloor = {
    w: prevFloor.w,
    h: FLOOR_HEIGHT,
    themeIdx: themeIdx,
    targetY: prevFloor.y - FLOOR_HEIGHT,
  };

  swingAngle = -Math.PI / 4;
  swingSpeed = 0.035 + Math.min(floorNum * 0.0018, 0.03);
}

function updateHud() {
  const floorCount = tower.length;
  document.getElementById('hudFloor').textContent = `${floorCount}F • ${floorCount * 3}m`;
  document.getElementById('hudScore').textContent = score;
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts += i < lives ? '❤️' : '🖤';
  document.getElementById('hudLives').textContent = hearts;
}

function dropFloor() {
  if (gameState !== 'playing' || !currentFloor || fallingFloor) return;
  Sound.init();
  Sound.play('drop');

  const hookX = craneX + Math.sin(swingAngle) * cableLength;
  const hookY = 50 + Math.cos(swingAngle) * cableLength;

  fallingFloor = {
    x: hookX - currentFloor.w / 2,
    y: hookY,
    w: currentFloor.w,
    h: currentFloor.h,
    vy: 14,
    themeIdx: currentFloor.themeIdx,
    targetY: currentFloor.targetY,
  };

  currentFloor = null;
}

function checkLanding() {
  if (!fallingFloor) return;

  fallingFloor.y += fallingFloor.vy;
  fallingFloor.vy += 0.8; // Gravity

  if (fallingFloor.y >= fallingFloor.targetY) {
    fallingFloor.y = fallingFloor.targetY;
    const topFloor = tower[tower.length - 1];
    const diff = fallingFloor.x - topFloor.x;
    const absDiff = Math.abs(diff);

    // Completely missed the tower below
    if (absDiff >= fallingFloor.w - 8) {
      Sound.play('miss');
      lives--;
      updateHud();
      // Floor tumbles off screen
      debrisList.push({
        x: fallingFloor.x,
        y: fallingFloor.y,
        w: fallingFloor.w,
        h: fallingFloor.h,
        vx: diff > 0 ? 5 : -5,
        vy: 4,
        rot: 0,
        vRot: 0.08,
        themeIdx: fallingFloor.themeIdx,
      });
      fallingFloor = null;

      if (lives <= 0) {
        gameOver();
      } else {
        setTimeout(spawnFloor, 400);
      }
      return;
    }

    // Perfect landing! (within 5px)
    if (absDiff <= 5) {
      fallingFloor.x = topFloor.x; // Auto-snap
      combo++;
      const bonus = 100 * combo;
      score += bonus;
      Sound.play('perfect');
      showComboBanner(`PERFECT! +${bonus}`);
      triggerSparks(fallingFloor.x + fallingFloor.w / 2, fallingFloor.y + fallingFloor.h);
    } else {
      // Overhang slices off
      combo = 0;
      score += 40;
      Sound.play('land');

      const sliceW = absDiff;
      const newW = fallingFloor.w - sliceW;
      const sliceX = diff > 0 ? topFloor.x + topFloor.w : fallingFloor.x;
      const newX = diff > 0 ? fallingFloor.x : topFloor.x;

      // Spawn falling debris slice
      debrisList.push({
        x: sliceX,
        y: fallingFloor.y,
        w: sliceW,
        h: fallingFloor.h,
        vx: diff > 0 ? 4 : -4,
        vy: 3,
        rot: 0,
        vRot: 0.1,
        themeIdx: fallingFloor.themeIdx,
      });

      fallingFloor.x = newX;
      fallingFloor.w = newW;
    }

    // Lock floor into tower
    tower.push({ ...fallingFloor });
    fallingFloor = null;

    // Smooth camera scroll up
    targetCameraY = Math.max(0, (tower.length - 5) * FLOOR_HEIGHT);

    updateHud();
    setTimeout(spawnFloor, 250);
  }
}

function showComboBanner(text) {
  const el = document.getElementById('comboBanner');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => { el.classList.remove('show'); }, 750);
}

function triggerSparks(x, y) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2;
    particles.push({
      x, y,
      vx: Math.cos(a) * (3 + Math.random() * 4),
      vy: Math.sin(a) * (3 + Math.random() * 4),
      color: Math.random() < 0.5 ? '#fde047' : '#38bdf8',
      life: 20, maxLife: 20,
    });
  }
}

function gameOver() {
  gameState = 'gameover';
  document.getElementById('finalFloors').textContent = tower.length;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('goSubtitle').textContent = `Tower stood at ${tower.length} Floors (${tower.length * 3} meters)!`;
  document.getElementById('modalGameOver').classList.remove('hidden');
}

// Background gradient based on camera altitude
function drawBackground() {
  const altitudeRatio = Math.min(1, cameraY / 1200);
  
  // Sky transition: Day blue -> Sunset orange -> Twilight violet -> Night starry black
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  if (altitudeRatio < 0.3) {
    // City day / twilight
    grad.addColorStop(0, '#0284c7');
    grad.addColorStop(0.6, '#38bdf8');
    grad.addColorStop(1, '#fed7aa');
  } else if (altitudeRatio < 0.7) {
    // Sunset to deep space
    grad.addColorStop(0, '#1e1b4b');
    grad.addColorStop(0.5, '#4c1d95');
    grad.addColorStop(1, '#f97316');
  } else {
    // Outer Space
    grad.addColorStop(0, '#030712');
    grad.addColorStop(0.5, '#0b0f19');
    grad.addColorStop(1, '#1e1b4b');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars in high altitude
  if (altitudeRatio > 0.4) {
    ctx.save();
    stars.forEach(s => {
      const sy = (s.y + cameraY * 0.4) % H;
      ctx.fillStyle = `rgba(255, 255, 255, ${s.a * Math.min(1, (altitudeRatio - 0.4) * 2.5)})`;
      ctx.beginPath();
      ctx.arc(s.x % W, sy, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // City Skyline Silhouettes at bottom
  const skylineY = H - 90 + cameraY;
  if (skylineY > -100) {
    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
    // Distant buildings
    for (let bx = 0; bx < W; bx += 38) {
      const bh = 90 + ((bx * 7) % 70);
      ctx.fillRect(bx, skylineY - bh, 34, bh + 100);
      // Tiny glowing window dots
      ctx.fillStyle = 'rgba(254, 240, 138, 0.4)';
      for (let wy = skylineY - bh + 10; wy < skylineY; wy += 14) {
        ctx.fillRect(bx + 6, wy, 4, 6);
        ctx.fillRect(bx + 20, wy, 4, 6);
      }
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
    }
    // Ground street
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, skylineY + 20, W, 120);
    ctx.fillStyle = '#475569';
    ctx.fillRect(0, skylineY + 20, W, 4); // Street curb
    ctx.restore();
  }
}

// Draw Building Floor Block
function drawBuildingFloor(x, y, w, h, themeIdx, isBase = false) {
  const theme = FLOOR_THEMES[themeIdx % FLOOR_THEMES.length];
  ctx.save();

  // Building masonry body
  ctx.fillStyle = theme.body;
  ctx.fillRect(x, y, w, h);

  // Cornice / Ledging
  ctx.fillStyle = theme.accent;
  ctx.fillRect(x, y, w, 5);
  ctx.fillRect(x, y + h - 4, w, 4);

  // Side 3D shadow bevel
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(x + w - 6, y, 6, h);

  // Architectural Windows
  if (isBase) {
    // Grand entrance lobby
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x + w / 2 - 16, y + h - 28, 32, 28);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(x + w / 2 - 13, y + h - 24, 11, 24);
    ctx.fillRect(x + w / 2 + 2, y + h - 24, 11, 24);
  } else {
    // Regular apartment / office windows
    const winCols = Math.max(1, Math.floor((w - 12) / 22));
    const winSpacing = (w - 12) / winCols;
    for (let c = 0; c < winCols; c++) {
      const wx = x + 8 + c * winSpacing;
      // Window frame
      ctx.fillStyle = theme.frame;
      ctx.fillRect(wx - 1, y + 10, 14, 20);
      // Window glass (some lit up yellow, some cyan)
      ctx.fillStyle = ((c + themeIdx) % 3 === 0) ? theme.window : 'rgba(255,255,255,0.75)';
      ctx.fillRect(wx + 1, y + 12, 10, 16);
      // Window cross divider
      ctx.fillStyle = theme.frame;
      ctx.fillRect(wx + 5, y + 12, 2, 16);
      ctx.fillRect(wx + 1, y + 19, 10, 2);
    }
  }

  ctx.restore();
}

function drawGame() {
  // Smooth camera interpolation
  cameraY += (targetCameraY - cameraY) * 0.1;

  ctx.clearRect(0, 0, W, H);
  drawBackground();

  ctx.save();
  ctx.translate(0, cameraY);

  // Draw Stacking Tower
  tower.forEach(f => {
    drawBuildingFloor(f.x, f.y, f.w, f.h, f.themeIdx, f.isBase);
  });

  // Draw Falling Floor
  if (fallingFloor) {
    drawBuildingFloor(fallingFloor.x, fallingFloor.y, fallingFloor.w, fallingFloor.h, fallingFloor.themeIdx);
  }

  // Draw Debris Slices
  debrisList.forEach(d => {
    ctx.save();
    ctx.translate(d.x + d.w / 2, d.y + d.h / 2);
    ctx.rotate(d.rot);
    drawBuildingFloor(-d.w / 2, -d.h / 2, d.w, d.h, d.themeIdx);
    ctx.restore();
  });

  // Draw Sparks
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  // Draw Crane & Swing Cable (Screen space)
  if (gameState === 'playing' && currentFloor) {
    swingAngle += swingSpeed;
    if (swingAngle > Math.PI / 3.2 || swingAngle < -Math.PI / 3.2) {
      swingSpeed = -swingSpeed;
    }

    const hookX = craneX + Math.sin(swingAngle) * cableLength;
    const hookY = 50 + Math.cos(swingAngle) * cableLength;

    // Crane Arm at top
    ctx.save();
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(0, 40, W, 10);
    ctx.fillStyle = '#d97706';
    ctx.fillRect(craneX - 18, 36, 36, 18);

    // Cable line
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(craneX, 48);
    ctx.lineTo(hookX, hookY);
    ctx.stroke();

    // Hook pulley
    ctx.fillStyle = '#475569';
    ctx.beginPath();
    ctx.arc(hookX, hookY, 6, 0, Math.PI * 2);
    ctx.fill();

    // Swinging Floor attached to hook
    drawBuildingFloor(hookX - currentFloor.w / 2, hookY, currentFloor.w, currentFloor.h, currentFloor.themeIdx);
    ctx.restore();
  }
}

function updatePhysics() {
  if (gameState !== 'playing') return;

  checkLanding();

  // Update debris
  debrisList.forEach(d => {
    d.x += d.vx;
    d.y += d.vy;
    d.vy += 0.8;
    d.rot += d.vRot;
  });
  debrisList = debrisList.filter(d => d.y < H + 200 + cameraY);

  // Update particles
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);
}

function loop() {
  updatePhysics();
  drawGame();
  requestAnimationFrame(loop);
}
loop();

// Tap to drop
cvs.addEventListener('pointerdown', dropFloor);

document.getElementById('btnStartGame').addEventListener('click', () => {
  document.getElementById('modalStart').classList.add('hidden');
  initGame();
  gameState = 'playing';
});

document.getElementById('btnRestartGame').addEventListener('click', () => {
  document.getElementById('modalGameOver').classList.add('hidden');
  initGame();
  gameState = 'playing';
});

// Pause / Resume messages from parent
window.addEventListener('message', (e) => {
  if (e.data?.type === 'PAUSE_GAME' && gameState === 'playing') {
    gameState = 'paused';
  } else if (e.data?.type === 'RESUME_GAME' && gameState === 'paused') {
    gameState = 'playing';
  }
});
</script>
</body>
</html>
